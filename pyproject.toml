[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitback-ai"
version = "0.1.0"
description = "Fitback AI service and graph utilities"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0",
  "neo4j==5.28.1",
  "openai==2.44.0",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitback-ai"
version = "0.1.0"
description = "Fitback AI GraphRAG mock ingestion utilities"
requires-python = ">=3.11"
dependencies = [
  "neo4j==5.28.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
